version: '3.8'

services:
  endee:
    image: endeeio/endee-server:latest
    container_name: endee-db
    ports:
      - "8080:8080"
    environment:
      - NDD_DATA_DIR=/tmp/data
    # volumes:
    #   - endee_data:/var/lib/endee/data
    restart: always

  # Optional: Containerize the app too, but for development running local is usually easier.
  # UNCOMMENT to run app in docker
  # app:
  #   build: .
  #   ports:
  #     - "8501:8501"
  #   depends_on:
  #     - endee
  #   environment:
  #     - ENDEE_URL=http://endee:8080

volumes:
  endee_data:
